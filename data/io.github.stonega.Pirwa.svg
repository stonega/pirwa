<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Pirwa</title>
  <desc>A simple blue monitor with a mint screen, sunglasses and a small smile.</desc>
  <!-- Host support and foot. -->
  <path d="M56 100h16v14H56z" fill="#1c71d8"/>
  <rect x="38" y="112" width="52" height="8" rx="3" fill="#1a5fb4"/>
  <rect x="38" y="110" width="52" height="8" rx="3" fill="#3584e4"/>
  <!-- A single display with a shallow lower profile and small corner radii. -->
  <rect x="12" y="24" width="104" height="80" rx="6" fill="#1a5fb4"/>
  <rect x="12" y="20" width="104" height="80" rx="6" fill="#3584e4"/>
  <rect x="20" y="28" width="88" height="60" rx="2" fill="#99f6e4"/>
  <!-- Sunglasses and a small smile, based on the supplied expression. -->
  <path d="M40 46h48" fill="none" stroke="#613583" stroke-width="4" stroke-linecap="round"/>
  <rect x="42" y="46" width="18" height="14" rx="3" fill="#613583"/>
  <rect x="68" y="46" width="18" height="14" rx="3" fill="#613583"/>
  <path d="M58 69q7 5 14-1" fill="none" stroke="#613583" stroke-width="3" stroke-linecap="round"/>
</svg>
