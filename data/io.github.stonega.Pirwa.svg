<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Pirwa</title>
  <desc>A friendly robot face on a mint screen, inside layered blue and violet monitors.</desc>
  <!-- Rear display: a shallow front profile below a flat top surface. -->
  <rect x="26" y="18" width="88" height="70" rx="14" fill="#613583"/>
  <rect x="26" y="14" width="88" height="70" rx="14" fill="#9141ac"/>
  <!-- Host support and foot. -->
  <path d="M50 100h18v14H50z" fill="#1c71d8"/>
  <rect x="34" y="112" width="50" height="8" rx="4" fill="#1a5fb4"/>
  <path d="M42 110h34a8 8 0 0 1 8 8H34a8 8 0 0 1 8-8z" fill="#3584e4"/>
  <!-- Host display. -->
  <rect x="12" y="30" width="94" height="76" rx="14" fill="#1a5fb4"/>
  <rect x="12" y="26" width="94" height="76" rx="14" fill="#3584e4"/>
  <rect x="20" y="34" width="78" height="58" rx="8" fill="#c7e6ff"/>
  <!-- Mint glass and a simple face, using the original violet pigment. -->
  <rect x="24" y="38" width="70" height="50" rx="5" fill="#99f6e4"/>
  <rect x="43" y="46" width="8" height="16" rx="4" fill="#613583"/>
  <rect x="67" y="46" width="8" height="16" rx="4" fill="#613583"/>
  <path d="M49 73q10 12 20 0" fill="none" stroke="#613583" stroke-width="4" stroke-linecap="round"/>
</svg>
